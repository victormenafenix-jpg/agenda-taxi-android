name: Armar app de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  armar:
    runs-on: ubuntu-latest
    env:
      HAY_FIRMA: ${{ secrets.FIRMA_PLAY_BASE64 != '' }}
    steps:
      - name: Bajar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto de Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node scripts/preparar-android.js

      - name: Usar siempre la misma firma (para poder instalar encima la versión nueva)
        run: mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore

      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: AgendaTaxi-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---- Versión para Google Play (.aab firmado) ----
      # Solo se arma si ya guardaste la firma en GitHub:
      # Settings > Secrets and variables > Actions > FIRMA_PLAY_BASE64 y FIRMA_PLAY_CLAVE
      - name: Preparar versión para Play Store
        if: env.HAY_FIRMA == 'true'
        env:
          FIRMA: ${{ secrets.FIRMA_PLAY_BASE64 }}
          PARA_PLAY: '1'
        run: |
          node scripts/preparar-android.js
          echo "$FIRMA" | base64 -d > "$RUNNER_TEMP/subida.jks"

      - name: Armar el .aab para Play Store
        if: env.HAY_FIRMA == 'true'
        working-directory: android
        env:
          CLAVE: ${{ secrets.FIRMA_PLAY_CLAVE }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/subida.jks" \
            -Pandroid.injected.signing.store.password="$CLAVE" \
            -Pandroid.injected.signing.key.alias=subida \
            -Pandroid.injected.signing.key.password="$CLAVE"

      - name: Guardar el .aab para subirlo a Play Store
        if: env.HAY_FIRMA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TaxiCentral-PlayStore-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

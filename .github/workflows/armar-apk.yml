name: Armar app de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto de Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node scripts/preparar-android.js

      - name: Usar siempre la misma firma (para poder instalar encima la versión nueva)
        run: mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore

      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: AgendaTaxi-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
